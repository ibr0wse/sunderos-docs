<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunderos Docs</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --base-background-color: #1e1e1e;
      --base-color: #c8c8c8;
      --theme-color: #42b983;
      --sidebar-background: #1a1a1a;
      --sidebar-nav-link-color: #b8b8b8;
      --sidebar-nav-link-color--active: #42b983;
      --cover-background-color: #1e1e1e;
      --search-background: #2a2a2a;
      --link-color: #42b983;
    }

    body {
      background-color: var(--base-background-color);
      color: var(--base-color);
    }

    .sidebar {
      background-color: var(--sidebar-background);
      color: var(--sidebar-nav-link-color);
      border-right: 1px solid #333;
    }

    .sidebar a {
      color: var(--sidebar-nav-link-color);
    }

    .sidebar a.active,
    .sidebar a:hover {
      color: var(--sidebar-nav-link-color--active);
    }

    .sidebar .sidebar-nav > ul > li > a {
      font-weight: 600;
    }

    .markdown-section {
      color: var(--base-color);
    }

    .markdown-section a {
      color: var(--link-color);
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4 {
      color: #e0e0e0;
    }

    .markdown-section code {
      background-color: #2a2a2a;
      color: #e06c75;
    }

    .markdown-section pre {
      background-color: #2a2a2a !important;
    }

    .markdown-section table th {
      background-color: #2a2a2a;
    }

    .markdown-section table td,
    .markdown-section table th {
      border-color: #444;
    }

    .markdown-section blockquote {
      border-left-color: var(--theme-color);
      color: #999;
    }

    .search .input-wrap {
      background-color: var(--search-background);
    }

    .search input {
      background-color: var(--search-background);
      color: var(--base-color);
    }

    .search .matching-post {
      border-bottom-color: #333;
    }

    .app-name-link {
      color: var(--theme-color) !important;
    }

    .markdown-section img {
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Sunderos Docs',
      repo: 'https://github.com/ibr0wse/sunderos-docs',
      loadSidebar: true,
      subMaxLevel: 2,
      search: {
        placeholder: 'Search docs...',
        noData: 'No results.',
        depth: 3
      },
      auto2top: true
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
